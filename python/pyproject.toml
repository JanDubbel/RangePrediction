[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lowtran-native-python"
version = "0.1.0"
description = "LOWTRAN 7 atmospheric spectra using Python and NumPy"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=2"]

[project.optional-dependencies]
examples = ["xarray", "python-dateutil", "matplotlib"]
tests = ["pytest", "xarray", "python-dateutil"]

[tool.setuptools]
packages = ["lowtran"]

[tool.setuptools.package-data]
lowtran = ["_tables.bin"]
